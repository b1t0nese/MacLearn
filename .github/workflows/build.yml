name: Build MacLearn

# Сборка бандлей: macOS (.app в .dmg) и Windows (.exe) — PyInstaller не умеет
# кросс-компиляцию, поэтому каждая платформа собирается на своём раннере.
# При пуше тега v* или X.Y.Z оба билда публикуются в GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ["v*", "*.*.*"]
  workflow_dispatch:

permissions:
  contents: write   # создание Release и загрузка ассетов по тегу

# повторные пуши отменяют устаревшие запуски того же ref
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8   # Windows-консоль cp1252 не умеет ✓ и кириллицу

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.lock
          pip install pyinstaller

      - name: Write version file
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="dev+$(git rev-parse --short HEAD)"
          fi
          echo "$VERSION" > version.txt
          echo "Building MacLearn $VERSION"

      - name: Import smoke check
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import main; from interface_module import translations; from version import get_app_version; assert translations.LANGUAGES, 'no translations loaded'; print('smoke ok', translations.LANGUAGES, get_app_version())"

      # add-data кладёт uis и translations в корень бандла (sys._MEIPASS/uis,
      # sys._MEIPASS/translations) — так их ищет frozen-код модулей интерфейса.
      # collect-data нужен qdarkstyle (.qss) и ultralytics (cfg .yaml) — их package
      # data PyInstaller по импортам не видит.
      # onedir (не onefile): torch на импорте поднимает multiprocessing-детей, и в
      # macOS onefile они падают на dlopen Qt-фреймворков; в onedir всё чисто.
      - name: Build onedir app + dmg
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MacLearn \
            --add-data "src/interface_module/uis:uis" \
            --add-data "src/interface_module/translations:translations" \
            --add-data "version.txt:." \
            --collect-data qdarkstyle \
            --collect-data ultralytics \
            src/main.py
          # .app — это папка, в releases можно класть только файлы → стандартный dmg
          hdiutil create -volname "MacLearn" -srcfolder dist/MacLearn.app \
            -ov -format UDZO MacLearn.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacLearn-macOS
          path: MacLearn.dmg

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MacLearn.dmg
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.lock
          pip install pyinstaller

      - name: Write version file
        shell: bash
        run: |
          VERSION="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="dev+$(git rev-parse --short HEAD)"
          fi
          echo "$VERSION" > version.txt
          echo "Building MacLearn $VERSION"

      - name: Import smoke check
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import main; from interface_module import translations; from version import get_app_version; assert translations.LANGUAGES, 'no translations loaded'; print('smoke ok', translations.LANGUAGES, get_app_version())"

      - name: Build onefile exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MacLearn `
            --add-data "src/interface_module/uis;uis" `
            --add-data "src/interface_module/translations;translations" `
            --add-data "version.txt;." `
            --collect-data qdarkstyle `
            --collect-data ultralytics `
            src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacLearn-windows
          path: dist/MacLearn.exe

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacLearn.exe
          generate_release_notes: true
